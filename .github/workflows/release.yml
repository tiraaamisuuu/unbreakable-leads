name: Release

on:
  push:
    tags: ['v*-mc26.3']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${VERSION%-mc26.3}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build Fabric and Paper
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          ./gradlew build -Pmod_version="$VERSION"
          ./gradlew -p paper build -Pplugin_version="$VERSION"
      - name: Collect release files and checksums
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir release
          cp "build/libs/unbreakable-leads-26.3-$VERSION.jar" release/
          cp "paper/build/libs/unbreakable-leads-paper-26.3-$VERSION.jar" release/
          cd release
          sha256sum *.jar > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag --title "Unbreakable Leads $VERSION — Minecraft 26.3 (Fabric & Paper)" \
            --notes-file "releases/$VERSION-mc26.3.md"
