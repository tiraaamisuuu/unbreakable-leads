plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = mod_version
group = maven_group

base { archivesName = "unbreakable-leads-${minecraft_version}" }

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${minecraft_version}+build.${yarn_build}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

loom { splitEnvironmentSourceSets() }

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'fabric_api_version', project.fabric_api_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'java_version', project.java_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: project.minecraft_version, fabric_api_version: project.fabric_api_version, loader_version: project.loader_version, java_version: project.java_version
    }
}

def targetJava = Integer.parseInt(java_version)
tasks.withType(JavaCompile).configureEach { options.release = targetJava }
java {
    sourceCompatibility = JavaVersion.toVersion(targetJava)
    targetCompatibility = JavaVersion.toVersion(targetJava)
}
